[package]
name = "async-arbitrage-engine"
version = "0.1.0"
edition = "2021"
authors = ["Quantitative Engineer"]
description = "Cross-exchange arbitrage engine with async I/O"

[lib]
name = "async_arbitrage_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# 网络
tungstenite = "0.21"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 原子操作
parking_lot = "0.12"

# 加密 (Binance API签名)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 指标
metrics = "0.24"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[features]
default = ["benchmark"]
benchmark = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true